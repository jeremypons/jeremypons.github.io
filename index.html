<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Jérémy Pons</title>
<meta name="theme-color" content="#F5F4F0">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;550&family=Geist+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root{--paper:#F5F4F0;--ink:#070707;--muted:#6B6873;--line:#E2E0DA;--tint:#C3C5FF;--accent:#5257C9;--bright:#B4B7FF}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.5 "Geist",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;display:grid;place-items:center;padding:16px;
  background-image:radial-gradient(70% 50% at 50% 115%,rgb(195 197 255 / .55),transparent 70%)}
main{width:100%;max-width:420px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:24px}
.mark{width:44px;height:44px;border-radius:50%;background:var(--tint);display:grid;place-items:center;font:400 22px/1 "Instrument Serif",Georgia,serif}
.label{font:400 12px/1.4 "Geist Mono",ui-monospace,monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
h1{margin:0;font:400 48px/1.05 "Instrument Serif",Georgia,serif;letter-spacing:-.02em}
h1 em{color:var(--accent)}
p{margin:0;color:var(--muted)}
form{width:100%;display:flex;flex-direction:column;gap:12px;margin-top:8px}
.field{display:flex;gap:8px;width:100%}
input[type=password]{flex:1;min-width:0;height:54px;padding:0 16px;border-radius:6px;border:1.5px solid var(--line);background:#fff;font:inherit;color:inherit}
input[type=password]:focus{outline:2px solid var(--accent);outline-offset:2px;border-color:var(--accent)}
button{height:54px;padding:0 24px;border:0;border-radius:6px;background:var(--ink);color:#fff;font:550 16px/1 inherit;font-family:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:10px}
button span{color:var(--bright)}
button:disabled{opacity:.6;cursor:wait}
.remember{display:flex;align-items:center;gap:8px;justify-content:center;font-size:14px;color:var(--muted)}
.err{min-height:21px;font-size:14px;color:#B3261E}
.foot{font-size:14px}
.foot a{color:var(--ink)}
@media (max-width:420px){h1{font-size:40px}.field{flex-direction:column}button{justify-content:center}}
</style>
</head>

function b64(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})}
async function keyFrom(pw){var base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(P.salt),iterations:P.iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},true,["decrypt"])}
async function open(key){var plain=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(P.iv)},key,b64(P.ct));
  var html=await new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
  document.open();document.write(html);document.close();}
(async function(){try{var k=localStorage.getItem("jp-k");if(k){var key=await crypto.subtle.importKey("raw",b64(k),"AES-GCM",false,["decrypt"]);await open(key);}}catch(e){try{localStorage.removeItem("jp-k")}catch(_){}}})();
document.getElementById("f").addEventListener("submit",async function(e){e.preventDefault();var b=document.getElementById("go"),err=document.getElementById("err");b.disabled=true;err.textContent="";
  try{var key=await keyFrom(document.getElementById("pw").value);
    if(document.getElementById("rem").checked){var raw=new Uint8Array(await crypto.subtle.exportKey("raw",key));try{localStorage.setItem("jp-k",btoa(String.fromCharCode.apply(null,raw)))}catch(_){}}
    await open(key);}
  catch(x){err.textContent="That password doesn’t match. Try again.";b.disabled=false;}});
